<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex, nofollow">
<title>Espace privé — ConfigPC</title>
<link rel="stylesheet" href="style.css?v=11">
<style>
  .admin-wrap { max-width: 860px; margin: 0 auto; }
  .adm-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .adm-card h3 { margin: 0 0 14px; font-size: 1.05rem; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 11px 13px; font-size: .92rem; font-family: 'Inter', sans-serif;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 120px; }
  .comp-block, .offer-block { border: 1px solid var(--border-soft); border-radius: 11px; padding: 14px; margin-bottom: 12px; background: var(--bg-2); }
  .offer-block { background: var(--panel); margin-top: 10px; }
  .blk-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
  .blk-head strong { font-size: .95rem; }
  .btn-mini { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: .8rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
  .btn-mini:hover { border-color: var(--accent); }
  .btn-mini.danger:hover { border-color: #ff5a5a; color: #ff9a9a; }
  .out { width: 100%; height: 190px; font-family: ui-monospace, Menlo, monospace; font-size: .74rem; background: #0b0d12; color: #9fe6c0; border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .steps { font-size: .88rem; color: var(--muted); line-height: 1.8; }
  .steps b { color: var(--text); }
  .lock { text-align: center; max-width: 400px; margin: 60px auto; }
  .ok-msg { color: var(--green); font-size: .86rem; margin-top: 8px; }
  .err-msg { color: #ff9a9a; font-size: .86rem; margin-top: 8px; }
</style>
</head>
<body>
<header class="site">
  <a class="logo" href="index.html"><img class="logo-img" src="logo.png" alt="ConfigPC">Config<span>PC</span></a>
  <div class="tag">🔒 Espace privé</div>
</header>

<main>
  <div class="admin-wrap" id="app"></div>
</main>

<script src="ui.js?v=11"></script>
<script>
const pj = document.createElement('script');
pj.src = 'products.js?t=' + Date.now();
document.head.appendChild(pj);
const sc = document.createElement('script');
sc.src = 'data.js?t=' + Date.now();
sc.onload = () => setTimeout(boot, 120);
sc.onerror = () => document.getElementById('app').innerHTML = '<div class="error-box">Impossible de charger data.js</div>';
document.head.appendChild(sc);

let DATA = [];

function boot(){
  DATA = JSON.parse(JSON.stringify(CONFIGS));
  render();
}

/* ---------- rendu ---------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="adm-card">
      <h3>🔒 Ton espace privé</h3>
      <p class="steps">Le catalogue contient <b id="nbprod">…</b> produits. Pour ajouter un prix
      à un produit du catalogue, ouvre <b>products.js</b> sur GitHub et complète son champ
      <code>offers</code> — ou utilise le générateur d'offre ci-dessous.<br><br>
      Cette page ne sert qu'à <b>fabriquer</b> tes configs. Rien n'est publié tant que
      tu n'as pas collé le résultat sur GitHub — et seul ton compte GitHub peut le faire.
      Tu peux l'utiliser depuis ton PC comme depuis ton téléphone.</p>
    </div>

    <div class="adm-card">
      <div class="blk-head"><h3 style="margin:0">Mes configs (${DATA.length})</h3>
        <button class="btn-mini" onclick="addConfig()">+ Nouvelle config</button></div>
      <div id="configs"></div>
    </div>

    <div class="adm-card">
      <h3>➕ Ajouter un prix à un produit du catalogue</h3>
      <div class="field"><label>Produit</label>
        <select id="psel"></select></div>
      <div class="row">
        <div class="field" style="flex:2"><label>Boutique</label><select id="pm"></select></div>
        <div class="field"><label>Prix</label><input type="number" step="0.01" id="pp" value="0"></div>
        <div class="field"><label>Port</label><input type="number" step="0.01" id="ps" value="0"></div>
      </div>
      <div class="field"><label>Lien du produit</label><input id="pu" placeholder="https://..."></div>
      <button class="btn" onclick="genOffer()">Générer la ligne à coller</button>
      <textarea class="out" id="pout" readonly style="height:80px;margin-top:10px"></textarea>
      <p class="steps" id="phint"></p>
    </div>

    <div class="adm-card">
      <h3>📋 Résultat à copier</h3>
      <p class="steps">Clique sur <b>Copier</b>, puis va sur GitHub → fichier <b>data.js</b> → crayon ✏️ →
      sélectionne tout (Ctrl+A) → colle → <b>Commit changes</b>.</p>
      <textarea class="out" id="output" readonly></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="copyOut()">📋 Copier</button>
        <button class="btn secondary" onclick="downloadOut()">💾 Télécharger data.js</button>
        <a class="btn secondary" id="ghlink" target="_blank" rel="noopener">✏️ Ouvrir GitHub</a>
      </div>
      <div id="copymsg"></div>
    </div>`;

  document.getElementById('ghlink').href = 'https://github.com/zedrox108/configpc/edit/main/data.js';
  fillProductTools();
  renderConfigs();
  updateOutput();
}

function renderConfigs(){
  const box = document.getElementById('configs');
  box.innerHTML = DATA.map((cfg,ci)=>`
    <div class="comp-block">
      <div class="blk-head">
        <strong>${cfg.name || 'Config sans nom'}</strong>
        <div>
          <button class="btn-mini" onclick="addComponent(${ci})">+ Composant</button>
          <button class="btn-mini danger" onclick="delConfig(${ci})">Supprimer</button>
        </div>
      </div>
      <div class="field"><label>Nom de la config</label>
        <input value="${esc(cfg.name)}" oninput="setV(${ci},null,null,'name',this.value)"></div>
      <div class="field"><label>Description</label>
        <input value="${esc(cfg.description||'')}" oninput="setV(${ci},null,null,'description',this.value)"></div>

      ${cfg.components.map((comp,pi)=>`
        <div class="offer-block">
          <div class="blk-head">
            <strong>${comp.category} — ${esc(comp.name)||'?'}</strong>
            <div>
              <button class="btn-mini" onclick="addOffer(${ci},${pi})">+ Marchand</button>
              <button class="btn-mini danger" onclick="delComponent(${ci},${pi})">✕</button>
            </div>
          </div>
          <div class="row">
            <div class="field"><label>Catégorie</label>
              <select onchange="setV(${ci},${pi},null,'category',this.value)">
                ${['CPU','GPU','RAM','Stockage','Carte mère','Alimentation','Boîtier','Refroidissement','Écran']
                  .map(c=>`<option ${c===comp.category?'selected':''}>${c}</option>`).join('')}
              </select></div>
            <div class="field" style="flex:2"><label>Nom du composant</label>
              <input value="${esc(comp.name)}" oninput="setV(${ci},${pi},null,'name',this.value)"></div>
          </div>
          <div class="field"><label>Photo (adresse de l'image, facultatif)</label>
            <input value="${esc(comp.image||'')}" placeholder="https://..." oninput="setV(${ci},${pi},null,'image',this.value)"></div>

          ${comp.offers.map((o,oi)=>`
            <div class="offer-block">
              <div class="blk-head">
                <strong>${(getMerchant(o.m)||{}).name || 'Marchand ?'}</strong>
                <button class="btn-mini danger" onclick="delOffer(${ci},${pi},${oi})">✕</button>
              </div>
              <div class="row">
                <div class="field" style="flex:2"><label>Boutique</label>
                  <select onchange="setV(${ci},${pi},${oi},'m',this.value)">
                    ${Object.keys(MERCHANTS).map(k=>{
                      const M=MERCHANTS[k];
                      return `<option value="${k}" ${k===o.m?'selected':''}>${M.name} (${M.shipsTo.join('/').toUpperCase()}) — ${M.cur}</option>`;
                    }).join('')}
                  </select></div>
                <div class="field"><label>Prix</label>
                  <input type="number" step="0.01" value="${o.price}" oninput="setV(${ci},${pi},${oi},'price',parseFloat(this.value)||0)"></div>
                <div class="field"><label>Port</label>
                  <input type="number" step="0.01" value="${o.shipping||0}" oninput="setV(${ci},${pi},${oi},'shipping',parseFloat(this.value)||0)"></div>
              </div>
              <div class="field"><label>Lien du produit</label>
                <input value="${esc(o.url||'')}" placeholder="https://..." oninput="setV(${ci},${pi},${oi},'url',this.value)"></div>
              <div class="row">
                <div class="field"><label>Stock</label>
                  <select onchange="setV(${ci},${pi},${oi},'stock',this.value)">
                    ${[['ok','En stock'],['low','Stock faible'],['out','Épuisé']]
                      .map(([v,l])=>`<option value="${v}" ${v===o.stock?'selected':''}>${l}</option>`).join('')}
                  </select></div>
                <div class="field"><label>Lien rémunéré (clk.sh)</label>
                  <input value="${esc(o.lockerUrl||'')}" placeholder="laisser vide si affilié" oninput="setV(${ci},${pi},${oi},'lockerUrl',this.value)"></div>
              </div>
            </div>`).join('')}
        </div>`).join('')}
    </div>`).join('') || '<p style="color:var(--muted)">Aucune config. Clique sur « + Nouvelle config ».</p>';
}

/* ---------- édition ---------- */
function esc(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); }
function setV(ci,pi,oi,key,val){
  if (oi!=null) DATA[ci].components[pi].offers[oi][key]=val;
  else if (pi!=null) DATA[ci].components[pi][key]=val;
  else DATA[ci][key]=val;
  updateOutput();
  if (key==='m'||key==='category') renderConfigs();
}
function uid(p){ return p+'-'+Math.random().toString(36).slice(2,7); }
function addConfig(){
  DATA.push({ id:uid('config'), name:'Nouvelle config', description:'', components:[] });
  renderConfigs(); updateOutput();
}
function delConfig(ci){ if(confirm('Supprimer cette config ?')){ DATA.splice(ci,1); renderConfigs(); updateOutput(); } }
function addComponent(ci){
  DATA[ci].components.push({ category:'CPU', name:'', image:'', offers:[] });
  renderConfigs(); updateOutput();
}
function delComponent(ci,pi){ DATA[ci].components.splice(pi,1); renderConfigs(); updateOutput(); }
function addOffer(ci,pi){
  DATA[ci].components[pi].offers.push({ id:uid('o'), m:'ldlc-fr', price:0, shipping:0, url:'', affiliate:false, lockerUrl:'', stock:'ok' });
  renderConfigs(); updateOutput();
}
function delOffer(ci,pi,oi){ DATA[ci].components[pi].offers.splice(oi,1); renderConfigs(); updateOutput(); }

/* ---------- génération du fichier ---------- */
function buildConfigsCode(){
  const j = JSON.stringify(DATA, null, 2)
    .replace(/"([a-zA-Z_$][\w$]*)":/g, '$1:');
  return 'const CONFIGS = ' + j + ';';
}
function fullFile(){
  // on récupère le data.js d'origine et on remplace juste le bloc CONFIGS
  const src = window.__DATAJS_SRC__ || '';
  if (!src) return buildConfigsCode();
  const start = src.indexOf('const CONFIGS');
  const endMark = '/* ===================== moteur';
  const end = src.indexOf(endMark);
  if (start === -1 || end === -1) return buildConfigsCode();
  return src.slice(0, start) + buildConfigsCode() + '\n\n' + src.slice(end);
}
function updateOutput(){ document.getElementById('output').value = fullFile(); }

function copyOut(){
  const t=document.getElementById('output'); t.select(); t.setSelectionRange(0,999999);
  navigator.clipboard.writeText(t.value).then(
    ()=>msg('✅ Copié ! Va sur GitHub, ouvre data.js, remplace tout et enregistre.','ok-msg'),
    ()=>msg('Sélectionne le texte et copie-le manuellement (Ctrl+C).','err-msg'));
}
function downloadOut(){
  const b=new Blob([document.getElementById('output').value],{type:'text/javascript'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='data.js'; a.click();
  msg('💾 Fichier téléchargé — envoie-le sur GitHub à la place de l\'ancien.','ok-msg');
}
function msg(t,c){ document.getElementById('copymsg').innerHTML = `<div class="${c}">${t}</div>`; }

function fillProductTools(){
  const sel = document.getElementById('psel'); if (!sel) return;
  const ms = document.getElementById('pm');
  if (typeof PRODUCTS === 'undefined') { sel.innerHTML='<option>products.js non chargé</option>'; return; }
  document.getElementById('nbprod').textContent = PRODUCTS.length;
  sel.innerHTML = PRODUCTS.map(p=>`<option value="${p.id}">${p.category} — ${p.name}</option>`).join('');
  ms.innerHTML = Object.keys(MERCHANTS).map(k=>{
    const M=MERCHANTS[k];
    return `<option value="${k}">${M.name} (${M.shipsTo.join('/').toUpperCase()}) — ${M.cur}</option>`;
  }).join('');
}
function genOffer(){
  const pid=document.getElementById('psel').value;
  const m=document.getElementById('pm').value;
  const price=parseFloat(document.getElementById('pp').value)||0;
  const ship=parseFloat(document.getElementById('ps').value)||0;
  const url=document.getElementById('pu').value.trim();
  const oid=pid.slice(0,26)+'-'+m;
  const line=`{ id:"${oid}", m:"${m}", price:${price}, shipping:${ship}, url:"${url}", stock:"ok" }`;
  document.getElementById('pout').value=line;
  document.getElementById('phint').innerHTML =
    `Ouvre <b>products.js</b> sur GitHub, trouve <code>id: "${pid}"</code>, et colle cette ligne entre les crochets de son <code>offers: []</code>.
     <a href="https://github.com/zedrox108/configpc/edit/main/products.js" target="_blank" rel="noopener">Ouvrir products.js →</a>`;
  navigator.clipboard.writeText(line).catch(()=>{});
}

/* on garde le texte source de data.js pour régénérer le fichier complet */
fetch('data.js?t='+Date.now()).then(r=>r.text()).then(t=>{ window.__DATAJS_SRC__=t; updateOutput(); }).catch(()=>{});
</script>
</body>
</html>
