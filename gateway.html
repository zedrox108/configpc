<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Redirection — ConfigPC</title>
<link rel="stylesheet" href="style.css?v=20">
</head>
<body>
<header class="site">
  <a class="logo" href="index.html"><img class="logo-img" src="logo.png" alt="ConfigPC">Config<span>PC</span></a>
</header>
<main><div id="gateway"></div></main>

<script src="ui.js?v=20"></script>
<script>
const s = document.createElement('script');
s.src = 'data.js?t=' + Date.now();
s.onload = () => fetch('configs.json?t='+Date.now())
  .then(r=>r.ok?r.json():{actives:[]}).catch(()=>({actives:[]}))
  .then(j=>init(j.actives||[]));
s.onerror = () => document.getElementById('gateway').innerHTML =
  '<div class="error-box">Impossible de charger l\'offre.</div>';
document.head.appendChild(s);

function init(actives){
  const q = new URLSearchParams(location.search);
  const cfg = actives.find(c=>c.id===q.get('cfg'));
  const comp = cfg && (cfg.components||[]).find(p=>p.id===q.get('c'));
  const root = document.getElementById('gateway');
  const retour = q.get('return')==='1';

  if (!comp) {
    root.innerHTML = `<div class="error-box"><h2>Lien invalide</h2>
      <p>Cette offre n'existe plus.</p><a class="btn secondary" href="index.html">Retour à l'accueil</a></div>`;
    return;
  }

  const M = comp.m ? getMerchant(comp.m) : null;
  const resume = `
    <div class="product-summary">
      <div class="label">${comp.category||''}</div>
      <div class="value">${comp.name||''}</div>
      <div class="label" style="margin-top:8px">Boutique</div>
      <div class="value">${M?flagSVG(M.flag)+' '+M.name:'—'} — ${fmtMoney((comp.price||0)+(comp.shipping||0))}</div>
    </div>`;

  const cle = 'cpc_step1_' + comp.id;
  const type = comp.linkType || 'direct';

  // lien direct ou affilié : un seul clic
  if (type !== 'passerelle') {
    root.innerHTML = `
      <div class="gateway-box">
        <div class="icon">➡️</div>
        <h1>Vous allez être redirigé</h1>
        <p>Vous allez rejoindre la boutique pour consulter cette offre.</p>
        ${resume}
        <button class="btn btn-continue" id="go">Continuer vers ${M?M.name:'la boutique'}</button>
      </div>`;
    document.getElementById('go').onclick = () => location.href = offerFinalUrl(comp);
    return;
  }

  // passerelle rémunérée : deux étapes
  const fait = localStorage.getItem(cle)==='1';
  if (fait || retour) {
    root.innerHTML = `
      <div class="gateway-box">
        <div class="step-indicator"><div class="dot done"></div><div class="dot active"></div></div>
        <div class="icon">✅</div>
        <h1>Merci ! Vous pouvez continuer</h1>
        <p>Cliquez ci-dessous pour accéder à la fiche produit.</p>
        ${resume}
        <button class="btn btn-continue" id="go2">Accéder au produit</button>
      </div>`;
    document.getElementById('go2').onclick = () => {
      localStorage.removeItem(cle);
      location.href = comp.url;
    };
  } else {
    root.innerHTML = `
      <div class="gateway-box">
        <div class="step-indicator"><div class="dot active"></div><div class="dot"></div></div>
        <div class="icon">⚠️</div>
        <h1>Vous allez être redirigé</h1>
        <p>Avant d'accéder à la fiche produit, vous allez passer par une page intermédiaire.
           Revenez ensuite ici pour accéder directement au produit.</p>
        ${resume}
        <button class="btn btn-continue" id="go1">Continuer</button>
      </div>`;
    document.getElementById('go1').onclick = () => {
      localStorage.setItem(cle,'1');
      if (comp.lockerUrl && comp.lockerUrl.trim()) location.href = comp.lockerUrl;
      else location.href = comp.url;
    };
  }
}
</script>
</body>
</html>
