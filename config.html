<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Détail de la config — ConfigPC</title>
<link rel="stylesheet" href="style.css?v=20">
</head>
<body>
<header class="site">
  <a class="logo" href="index.html"><img class="logo-img" src="logo.png" alt="ConfigPC">Config<span>PC</span></a>
  <div class="tag">Configs mises à jour régulièrement</div>
</header>

<main>
  <a class="back-link" href="index.html">← Toutes les configs</a>
  <div id="content"></div>
</main>

<footer class="site">
  © <span id="year"></span> ConfigPC — <a href="index.html">Accueil</a>
</footer>

<script src="ui.js?v=20"></script>
<script>
const s = document.createElement('script');
s.src = 'data.js?t=' + Date.now();
s.onload = () => fetch('configs.json?t='+Date.now())
  .then(r=>r.ok?r.json():{actives:[]}).catch(()=>({actives:[]}))
  .then(j=>init(j.actives||[]));
s.onerror = () => document.getElementById('content').innerHTML =
  '<div class="error-box"><h2>Erreur</h2><p>Impossible de charger la configuration.</p></div>';
document.head.appendChild(s);

const STOCK = { ok:{txt:"En stock",cls:"stock-ok"}, low:{txt:"Stock faible",cls:"stock-low"}, out:{txt:"Épuisé",cls:"stock-out"} };

function init(actives){
  document.getElementById("year").textContent = new Date().getFullYear();
  const id = new URLSearchParams(location.search).get('id');
  const cfg = actives.find(c=>c.id===id);
  const content = document.getElementById('content');

  if (!cfg || configExpiree(cfg)) {
    content.innerHTML = `<div class="error-box">
      <h2>${cfg?'Cette configuration n\'est plus disponible':'Configuration introuvable'}</h2>
      <p>${cfg?'Son offre est arrivée à échéance.':'Elle a peut-être été retirée.'}</p>
      <a class="btn secondary" href="index.html">Voir les configs en cours</a></div>`;
    return;
  }

  const L = getLabel(cfg.label), T = getTier(cfg.tier);
  content.innerHTML = `
    ${L?`<div class="detail-label ${L.flocons?'snow':''}" style="background:${L.bg};color:${L.fg};border-color:${L.bord}">
          ${L.deco?`<span class="deco">${L.deco}</span>`:''}${L.nom}</div>`:''}
    <div class="config-header reveal">
      <div>
        ${T?`<span class="tier-badge" style="--tc:${T.couleur}">${T.nom}</span>`:''}
        <h1>${cfg.name}</h1>
        <div class="sub">${cfg.description||''}</div>
        ${cfg.expire?`<div class="countdown-line big" data-end="${cfg.expire}"></div>`:''}
      </div>
      <div class="total-wrap">
        <div class="total-label">Total de la config</div>
        <div class="config-total">${configTotalText(cfg)}</div>
      </div>
    </div>
    <div class="section-label">Les composants</div>
    <div id="components"></div>`;

  const box = document.getElementById('components');
  (cfg.components||[]).forEach((p,i)=>{
    const M = p.m ? getMerchant(p.m) : null;
    const st = p.stock && STOCK[p.stock] ? `<span class="stock-badge ${STOCK[p.stock].cls}">${STOCK[p.stock].txt}</span>` : '';
    const port = p.shipping>0 ? `+ ${fmtMoney(p.shipping)} de port` : 'port offert';
    const card = document.createElement('div');
    card.className = 'component-card reveal';
    card.style.animationDelay = (0.05*i)+'s';
    card.innerHTML = `
      <div class="component-head">
        <div class="component-info">
          <div class="ico">${categoryIcon(p.category)}</div>
          <div>
            <div class="category">${p.category||''}${(p.qty||1)>1?` · ×${p.qty}`:''}</div>
            <div class="name">${p.name||'—'}</div>
            ${p.spec?`<div class="spec-line">${p.spec}</div>`:''}
            <div class="best-inline">
              ${M?`${flagSVG(M.flag)} <strong>${M.name}</strong>`:''}
              <span class="port">${port}</span> ${st}
            </div>
            ${p.note?`<div class="comp-note">💬 ${p.note}</div>`:''}
            ${M&&M.warn?`<div class="merchant-warn">⚠ ${M.warn}</div>`:''}
          </div>
        </div>
        <div class="head-right">
          <div class="offer-prices"><span class="offer-total">${fmtOffer(p)}</span></div>
          ${p.url?`<a class="btn" href="gateway.html?cfg=${encodeURIComponent(cfg.id)}&c=${encodeURIComponent(p.id)}">Voir l'offre</a>`:''}
        </div>
      </div>`;
    box.appendChild(card);
  });

  revealOnScroll();
  minuteurs();
}

function minuteurs(){
  const els=[...document.querySelectorAll('.countdown-line[data-end]')].filter(e=>e.dataset.end);
  if(!els.length) return;
  const tick=()=>els.forEach(el=>{
    const end=new Date(el.dataset.end).getTime(); let d=end-Date.now();
    if(isNaN(end)){el.textContent='';return;}
    if(d<=0){el.textContent='⏱ offre terminée';return;}
    const j=Math.floor(d/86400000); d-=j*86400000;
    const h=Math.floor(d/3600000); d-=h*3600000;
    const m=Math.floor(d/60000);
    el.innerHTML = `⏱ valable encore <strong>${j>0?j+'j ':''}${h}h ${m}m</strong>`;
  });
  tick(); setInterval(tick,30000);
}
</script>
</body>
</html>
