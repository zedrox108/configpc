<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Comparateur de prix — ConfigPC</title>
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<header class="site">
  <a class="logo" href="index.html"><img class="logo-img" src="logo.png" alt="ConfigPC">Config<span>PC</span></a>
  <nav class="mainnav">
    <a href="index.html" class="navlink">Configs</a>
    <a href="compare.html" class="navlink active">Comparateur</a>
  </nav>
</header>

<main>
  <section class="hero" style="padding:20px 0 26px">
    <h1 style="font-size:clamp(1.6rem,4vw,2.3rem)">Comparateur de <span class="grad">prix</span></h1>
    <p>Tous les composants, tous les marchands disponibles dans votre pays, du moins cher au plus cher — frais de port inclus.</p>
  </section>

  <div id="notice"></div>

  <div class="cmp-tools">
    <input type="search" id="search" class="cmp-search" placeholder="Rechercher un composant (ex : RTX 4070)…" autocomplete="off">
    <select id="cat" class="cmp-select"><option value="">Toutes les catégories</option></select>
    <select id="onlyprice" class="cmp-select">
      <option value="0">Tout le catalogue</option>
      <option value="1">Avec prix uniquement</option>
    </select>
  </div>

  <div id="results"></div>
</main>

<footer class="site">© <span id="year"></span> ConfigPC — <a href="index.html">Accueil</a></footer>

<script src="ui.js?v=13"></script>
<script>
  function loadScript(src){ return new Promise((ok,ko)=>{
    const s=document.createElement('script'); s.src=src+'?t='+Date.now();
    s.onload=ok; s.onerror=ko; document.head.appendChild(s); }); }
  const sc = { onerror:null };
  Promise.all([loadScript('data.js'), loadScript('products.js')])
    .then(()=>Promise.all([loadHistory(), loadAutoOffers()]))
    .then(()=>{ if (typeof PRODUCTS !== 'undefined') attachAutoOffers(PRODUCTS); })
    .then(initCompare)
    .catch(()=>{ document.getElementById('results').innerHTML =
      '<div class="error-box"><h2>Erreur</h2><p>Impossible de charger le catalogue.</p></div>'; });
  const _unused = () => {
  };

  function initCompare(){
    document.getElementById("year").textContent = new Date().getFullYear();
    initCountrySelector();
    document.getElementById("notice").innerHTML = countryNotice();

    const STOCK = { ok:{txt:"En stock",cls:"stock-ok"}, low:{txt:"Stock faible",cls:"stock-low"}, out:{txt:"Épuisé",cls:"stock-out"} };

    // catalogue produits + composants issus des configs
    const items = [];
    if (typeof PRODUCTS !== 'undefined') {
      PRODUCTS.forEach(p => items.push({
        name:p.name, category:p.category, spec:p.spec||'', brand:p.brand||'',
        image:p.image||'', offers:(p.offers||[]).slice()
      }));
    }
    CONFIGS.forEach(cfg => cfg.components.forEach(comp => {
      let it = items.find(x => x.name === comp.name && x.category === comp.category);
      if (!it) { it = { name:comp.name, category:comp.category, spec:'', image:comp.image, offers:[] }; items.push(it); }
      comp.offers.forEach(o => { if (!it.offers.find(z => z.id === o.id)) it.offers.push(o); });
    }));
    items.sort((a,b)=>{
      const ao=sortedOffers(a).length>0, bo=sortedOffers(b).length>0;
      if (ao!==bo) return ao?-1:1;
      return a.category.localeCompare(b.category) || a.name.localeCompare(b.name);
    });

    // catégories
    const catSel = document.getElementById("cat");
    [...new Set(items.map(i=>i.category))].forEach(c=>{
      const op=document.createElement("option"); op.value=c; op.textContent=c; catSel.appendChild(op);
    });

    const ALIAS = {
      "Stockage":"ssd nvme disque dur stockage",
      "GPU":"gpu carte graphique",
      "CPU":"cpu processeur",
      "RAM":"ram memoire vive barrette",
      "Carte mère":"carte mere motherboard mobo",
      "Alimentation":"alimentation psu bloc",
      "Boîtier":"boitier case tour",
      "Refroidissement":"refroidissement ventirad watercooling aio",
      "Ventilateur":"ventilateur ventilo"
    };
    const norm = s => String(s||'').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')   // enlève les accents
      .replace(/[^a-z0-9]+/g,' ').trim();
    items.forEach(i => { i._s = norm(i.name+' '+i.category+' '+(i.spec||'')+' '+(ALIAS[i.category]||'')); });
    const search = document.getElementById("search");
    const results = document.getElementById("results");

    function offerLine(o, isBest){
      const M = offerMerchant(o);
      const stock = o.stock && STOCK[o.stock] ? `<span class="stock-badge ${STOCK[o.stock].cls}">${STOCK[o.stock].txt}</span>` : "";
      const port = o.shipping > 0 ? `+ ${fmtMoney(o.shipping, M.cur)} port` : "port offert";
      const conv = offerIsForeignCurrency(o)
        ? `<span class="conv">≈ ${fmtMoney(offerTotalIn(o), countryCurrency())}</span>` : "";
      let promo = (o.promo && o.promo.active)
        ? `<span class="promo-badge">🔥 Promo</span><span class="countdown" data-end="${o.promo.endDate||''}"></span>` : "";
      // baisse détectée automatiquement par le bot
      const b = baisseDePrix(o.id, offerTotal(o));
      if (b) promo += `<span class="drop-badge">📉 −${fmtMoney(b.ecart, M.cur)} (${b.pct.toFixed(0)} %)</span>` +
        (b.plusBasJamaisVu ? `<span class="lowest-badge">⭐ prix le plus bas</span>` : '');
      if (o.ancien_prix && o.ancien_prix > o.price)
        promo += `<span class="promo-badge">🔥 −${fmtMoney(o.ancien_prix - o.price, M.cur)}</span>`;
      return `
        <div class="offer-line ${isBest?'best':''}">
          <div class="offer-merchant">
            ${isBest ? '<span class="best-tag">Le moins cher</span>' : ''}
            <span class="m-name">${flagSVG(M.flag)}${M.name}</span>
            <span class="m-sub">${port} ${stock}${o.auto?` <span class="auto-badge" title="Prix relevé automatiquement le ${o.maj||''}">🤖 auto</span>`:''}</span>
            ${promo ? `<div class="promo-line">${promo}</div>` : ""}
            ${M.warn ? `<div class="merchant-warn">⚠ ${M.warn}</div>` : ""}
          </div>
          <div class="offer-right">
            <div class="offer-prices">${conv}<span class="offer-total">${fmtOffer(o)}</span></div>
            <a class="btn" href="gateway.html?ref=${encodeURIComponent(o.id)}">Voir l'offre</a>
          </div>
        </div>`;
    }

    function render(){
      const words = norm(search.value).split(' ').filter(Boolean);
      const cat = catSel.value;
      const onlyP = document.getElementById('onlyprice').value === '1';
      let list = items.filter(i =>
        (!cat || i.category === cat) &&
        (!onlyP || sortedOffers(i).length > 0) &&
        (!words.length || words.every(w => i._s.includes(w))));
      const totalFound = list.length;
      const LIMIT = 60;
      list = list.slice(0, LIMIT);

      if (!list.length) { results.innerHTML = `<p style="color:var(--muted);text-align:center;padding:30px">Aucun composant trouvé.${onlyP?'<br><small>Essayez « Tout le catalogue » pour voir les produits sans prix.</small>':''}</p>`; return; }
      const countNote = `<p class="result-count">${totalFound} produit${totalFound>1?'s':''} trouvé${totalFound>1?'s':''}</p>`;
      const moreNote = totalFound > LIMIT
        ? `<p style="color:var(--muted);text-align:center;padding:14px">${totalFound} produits trouvés — les ${LIMIT} premiers sont affichés. Affinez votre recherche.</p>` : '';

      results.innerHTML = countNote + list.map(it => {
        const offers = sortedOffers(it);
        const img = it.image
          ? `<img class="comp-img" src="${it.image}" alt="" loading="lazy">`
          : `<div class="ico">${categoryIcon(it.category)}</div>`;
        if (!offers.length) return `
          <div class="component-card noprice">
            <div class="component-head"><div class="component-info">${img}
              <div><div class="category">${it.category}</div><div class="name">${it.name}</div>
              ${it.spec?`<div class="spec-line">${it.spec}</div>`:''}
              <div class="best-inline">${it.offers.length? 'Aucun marchand ne livre dans votre pays' : 'Prix pas encore renseigné'}</div>
              </div></div></div>
          </div>`;
        return `
          <div class="component-card">
            <div class="component-head">
              <div class="component-info">${img}
                <div>
                  <div class="category">${it.category}</div>
                  <div class="name">${it.name}</div>
                  ${it.spec?`<div class="spec-line">${it.spec}</div>`:''}
                  <div class="best-inline">Dès <strong>${fmtOffer(offers[0])}</strong> · ${offers.length} marchand${offers.length>1?'s':''}</div>
                </div>
              </div>
              <div class="head-right">
                <button class="compare-toggle hist-btn" data-ids="${offers.map(o=>o.id).join(',')}">📈 Historique</button>
              </div>
            </div>
            <div class="chart-panel"></div>
            <div class="offers-panel open">${offers.map((o,i)=>offerLine(o,i===0)).join("")}</div>
          </div>`;
      }).join("") + moreNote;
      startCountdowns();
      bindHistory();
    }

    function bindHistory(){
      document.querySelectorAll('.hist-btn').forEach(btn=>{
        btn.addEventListener('click', e=>{
          e.stopPropagation();
          const panel = btn.closest('.component-card').querySelector('.chart-panel');
          const open = panel.classList.toggle('open');
          btn.textContent = open ? '📈 Masquer' : '📈 Historique';
          if (open && !panel.dataset.done) {
            const ids = btn.dataset.ids.split(',');
            panel.innerHTML = priceChartSVG(bestPriceSeries(ids, countryCurrency()), countryCurrency());
            panel.dataset.done = '1';
          }
        });
      });
    }

    search.addEventListener("input", render);
    catSel.addEventListener("change", render);
    document.getElementById('onlyprice').addEventListener('change', render);
    render();
  }

  function startCountdowns(){
    const els=[...document.querySelectorAll(".countdown[data-end]")].filter(e=>e.dataset.end);
    if(!els.length) return;
    function tick(){ const now=Date.now(); els.forEach(el=>{
      const end=new Date(el.dataset.end).getTime(); let d=end-now;
      if(isNaN(end)){el.textContent="";return;} if(d<=0){el.textContent="· terminée";return;}
      const j=Math.floor(d/86400000); d-=j*86400000; const h=Math.floor(d/3600000);
      el.textContent=`· fin dans ${j}j ${h}h`; }); }
    tick(); setInterval(tick,60000);
  }
</script>
</body>
</html>
